<!-- ============================================
     Multi Tool Hub - Text Cleaner UI
     ============================================ -->

<div class="textcleaner-container">
  <div class="form-group">
    <label>
      <span class="icon">📝</span> Dán văn bản cần làm sạch:
    </label>
    <textarea id="tc-input" rows="3" placeholder="Paste text with HTML, Markdown, tables..."></textarea>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
    <select id="tc-level" style="flex:1; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; font-size:13px; background:var(--surface); color:var(--text); cursor:pointer; min-width:120px;">
      <option value="BASIC">🔰 Cơ bản</option>
      <option value="STANDARD" selected>⭐ Tiêu chuẩn</option>
      <option value="ADVANCED">🚀 Nâng cao</option>
    </select>
    
    <button id="tc-clean-btn" class="action-btn primary" style="flex:1; padding:8px 12px; background: linear-gradient(135deg, #2ECC71, #27AE60); margin-bottom:0;">
      <span class="icon-circle" style="font-size:14px;">🧹</span>
      <span>Làm sạch</span>
    </button>
    
    <button id="tc-copy-btn" class="action-btn secondary" style="flex:0.6; padding:8px 12px; margin-bottom:0;">
      <span>📋 Copy</span>
    </button>
  </div>

  <div class="form-group">
    <label>
      <span class="icon">✨</span> Kết quả:
      <span id="tc-stats" style="font-size:11px; color:var(--text-muted); font-weight:400; margin-left:8px;"></span>
    </label>
    <textarea id="tc-output" rows="3" readonly placeholder="Clean text will appear here..."></textarea>
  </div>

  <div id="tc-detection" style="display:none; margin-bottom:8px; padding:8px 12px; background:#f8f9fa; border-radius:var(--radius-sm); font-size:12px; color:var(--text-muted);">
    <span style="font-weight:600;">🔍 Phát hiện:</span>
    <span id="tc-detection-text"></span>
  </div>

  <div class="status-bar">
    <span class="dot" id="tc-status-dot"></span>
    <span id="tc-status">Dán text và bấm "Làm sạch"</span>
  </div>
</div>
