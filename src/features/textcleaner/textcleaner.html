<!-- ============================================
     Multi Tool Hub - Text Cleaner UI
     ============================================ -->

<div class="textcleaner-container">
  <!-- Nút lấy dữ liệu từ clipboard -->
  <button id="tc-paste-btn" class="action-btn primary" style="width:100%; padding:10px 12px; background: linear-gradient(135deg, #2ECC71, #27AE60); margin-bottom:10px;">
    <span style="font-size:16px; margin-right:8px;">📋</span>
    <span>Dán văn bản từ clipboard</span>
    <span style="margin-left:auto; font-size:11px; opacity:0.7;">Ctrl+V</span>
  </button>

  <!-- Cấp độ lọc + Nút làm sạch -->
  <div style="display:flex; gap:8px; margin-bottom:10px;">
    <select id="tc-level" style="flex:1; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; font-size:13px; background:var(--surface); color:var(--text); cursor:pointer;">
      <option value="BASIC">🔰 Cơ bản</option>
      <option value="STANDARD" selected>⭐ Tiêu chuẩn</option>
      <option value="ADVANCED">🚀 Nâng cao</option>
    </select>
    
    <button id="tc-clean-btn" class="action-btn primary" style="flex:1; padding:8px 12px; background: linear-gradient(135deg, #3498db, #2980b9); margin-bottom:0;">
      <span style="font-size:14px; margin-right:4px;">🧹</span>
      <span>Làm sạch & Copy</span>
    </button>
  </div>

  <!-- Kết quả -->
  <div class="form-group" style="margin-bottom:8px;">
    <label style="font-size:12px; color:var(--text-muted);">
      <span>✨</span> Kết quả:
      <span id="tc-stats" style="font-weight:400; margin-left:8px;"></span>
    </label>
    <textarea id="tc-output" rows="3" readonly placeholder="Kết quả sẽ hiển thị ở đây..." style="background:#f8f9fa; cursor:default;"></textarea>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <span class="dot" id="tc-status-dot"></span>
    <span id="tc-status">Sẵn sàng - Dán text từ clipboard</span>
  </div>
</div>
